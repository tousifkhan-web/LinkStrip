<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 330px;
        font-family: "Segoe UI", system-ui, sans-serif;
        padding: 12px;
        background: #1e1e1e;
        color: #ffffff;
        margin: 0;
      }
      h3 {
        margin: 0 0 10px 0;
        font-size: 14px;
        font-weight: 600;
        padding-bottom: 8px;
        border-bottom: 1px solid #333;
      }
      #video-list {
        max-height: 380px;
        overflow-y: auto;
      }
      .video-btn {
        display: block;
        width: 100%;
        text-align: left;
        background: #2b2b2b;
        color: #e0e0e0;
        border: 1px solid #3a3a3a;
        padding: 9px 10px;
        margin-bottom: 6px;
        cursor: pointer;
        border-radius: 5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        box-sizing: border-box;
        transition: 0.15s;
      }
      .video-btn:hover {
        background: #383838;
        border-color: #555555;
      }
      .yt {
        border-left: 4px solid #ff3333;
      }
      .direct {
        border-left: 4px solid #00c853;
      }
      #status {
        font-size: 12px;
        margin-top: 8px;
        min-height: 16px;
        color: #4caf50;
        font-weight: 500;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h3>Found Videos</h3>
    <div id="video-list">Scanning page...</div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
